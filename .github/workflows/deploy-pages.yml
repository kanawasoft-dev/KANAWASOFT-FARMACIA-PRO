name: Deploy KANAWA SOFT Farmácia PRO to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Deploy frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: bdee5b7062883657a07bf88e0f229ce7
          command: pages deploy frontend --project-name=kanawasoft-farmacia-pro --branch=main
<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b35">
  <title>Kanawa Soft Farmácia PRO</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="saas.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">K+</div>
        <div><strong>KANAWA SOFT</strong><small>FARMÁCIA</small></div>
      </div>
      <div class="side-caption">MENU PRINCIPAL</div>
      <nav id="navigation" aria-label="Navegação principal"></nav>
      <div class="sidebar-footer">
        <span class="status-dot"></span> Sistema
        <small>Kanawa Soft · Farmácia</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="menuToggle" aria-label="Abrir menu">☰</button>
        <div class="breadcrumb"><span>Kanawa Soft</span><b>/</b><strong id="pageTitle">Painel</strong></div>
        <div class="top-actions">
          <span class="today" id="today"></span>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema">☾ Tema</button>
          <button class="user-chip" id="userButton"><span class="avatar">KS</span><span><b>Conta</b><small>Sessão</small></span></button>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
      <footer class="app-footer">© <span id="year"></span> Kanawa Soft · Gestão integrada de farmácia</footer>
    </main>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <dialog id="recordDialog" class="record-dialog">
    <form id="recordForm" method="dialog">
      <div class="dialog-head"><div><small id="dialogEyebrow">REGISTO</small><h2 id="dialogTitle">Novo registo</h2></div><button class="icon-btn" type="button" id="closeDialog">✕</button></div>
      <div class="form-grid" id="formFields"></div>
      <div class="dialog-actions"><button type="button" class="btn btn-light" id="cancelDialog">Cancelar</button><button class="btn btn-primary" type="submit">Guardar registo</button></div>
    </form>
  </dialog>
  <style>
    .auth-gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:#f3f6f5;font-family:Arial,sans-serif}
    .auth-card{width:min(100%,420px);background:#fff;border:1px solid #e1e9e6;border-radius:18px;padding:30px;box-shadow:0 18px 60px #173d3518}
    .auth-brand{font-weight:800;letter-spacing:.08em;color:#123b35}.auth-card h1{font-size:24px;margin:22px 0 8px;color:#173d35}.auth-card p{color:#66756f;line-height:1.5}
    .auth-field{display:block;margin:16px 0}.auth-field span{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#344b43}.auth-field input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd8d3;border-radius:9px;font:inherit}
    .auth-submit{width:100%;padding:13px;border:0;border-radius:9px;background:#123b35;color:white;font-weight:700;cursor:pointer;margin-top:8px}.auth-link{border:0;background:none;color:#176b59;text-decoration:underline;cursor:pointer;padding:12px 0}.auth-message{min-height:22px;font-size:13px;color:#a33}.auth-note{font-size:12px;color:#7b8983;margin-top:18px}
  </style>
  <script type="module">
    import './supabase.js';

    const themeButton = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('kanawa-theme') || 'light';
    document.documentElement.dataset.theme = savedTheme;
    const paintThemeButton = () => {
      if (themeButton) themeButton.textContent = document.documentElement.dataset.theme === 'dark' ? '☀ Tema' : '☾ Tema';
    };
    paintThemeButton();
    themeButton?.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('kanawa-theme', next);
      paintThemeButton();
    });

    const sb = window.KANAWA_SUPABASE;
    const shell = document.querySelector('.app-shell');
    let appLoaded = false;
    let authInProgress = false;

    shell.hidden = true;
    const gate = document.createElement('main');
    gate.className = 'auth-gate';
    gate.innerHTML = `
      <section class="auth-card">
        <div class="auth-brand"><span class="auth-mark">K+</span><span>KANAWA SOFT<small>FARMÁCIA PRO</small></span></div>
        <div class="auth-kicker">ÁREA RESERVADA</div>
        <h1 id="authTitle">Bem-vindo de volta</h1>
        <p id="authDescription">Entre com as credenciais da sua empresa para aceder ao sistema.</p>
        <div class="auth-alert info" role="note"><b>Antes de entrar</b><span>Utilize o e-mail registado. O acesso depende da aprovação da empresa e das permissões atribuídas.</span></div>
        <form id="authForm" novalidate>
          <label class="auth-field"><span>E-mail profissional</span><input id="authEmail" type="email" autocomplete="username" required placeholder="nome@empresa.com" aria-describedby="emailHelp"><small id="emailHelp">Exemplo: administrador@empresa.com</small></label>
          <label class="auth-field"><span>Palavra-passe</span><input id="authPassword" type="password" autocomplete="current-password" required placeholder="Introduza a sua palavra-passe" aria-describedby="passwordHelp"><small id="passwordHelp">A palavra-passe é privada. Nunca a partilhe com terceiros.</small></label>
          <button class="auth-submit" id="authSubmit" type="submit">Entrar na plataforma</button>
        </form>
        <button class="auth-link" id="forgotPassword" type="button">Esqueci-me da palavra-passe</button>
        <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>
        <div class="auth-note">Protecção de conta activa: os dados só são apresentados aos utilizadores autorizados da respectiva empresa.</div>
        <div class="auth-register">Ainda não tem conta? <a href="./adesao.html">Criar conta e registar empresa</a></div>
        <div class="auth-footer">KANAWA SOFT · Plataforma empresarial</div>
      </section>`;
    document.body.append(gate);

    const message = (value, ok=false) => {
      const el = document.getElementById('authMessage');
      el.textContent = value;
      el.style.color = ok ? '#176b59' : '#a33';
    };
    const setBusy = (busy, label='A validar…') => {
      const button = document.getElementById('authSubmit');
      button.disabled = busy;
      button.textContent = busy ? label : 'Entrar na plataforma';
      document.getElementById('authEmail').disabled = busy;
      document.getElementById('authPassword').disabled = busy;
    };
    const explainAuthError = error => {
      const code = error?.code || error?.name || '';
      const raw = String(error?.message || '').toLowerCase();
      if (code === 'invalid_credentials' || raw.includes('invalid login credentials') || raw.includes('invalid_credentials')) {
        return 'Não foi possível validar o acesso. Confirme o e-mail e a palavra-passe. Se ainda não tem conta, utilize “Criar conta e registar empresa”.';
      }
      if (raw.includes('fetch') || raw.includes('network') || raw.includes('failed to fetch')) {
        return 'Não foi possível contactar o servidor de autenticação. Verifique a Internet e tente novamente.';
      }
      if (raw.includes('email not confirmed')) return 'O e-mail ainda não foi confirmado. Abra a mensagem enviada para a sua caixa de correio.';
      if (raw.includes('too many requests')) return 'Foram feitas várias tentativas. Aguarde alguns minutos e volte a tentar.';
      return 'Ocorreu um erro ao iniciar sessão. Verifique os dados e tente novamente ou contacte o suporte.';
    };

    async function loadPanel(path) {
      if (appLoaded) return;
      message('Acesso confirmado. A carregar os módulos e os dados…', true);
      const script = document.createElement('script');
      script.src = path;
      script.onload = () => {
        appLoaded = true;
        message('Painel carregado.', true);
      };
      script.onerror = () => {
        appLoaded = false;
        shell.hidden = true;
        gate.hidden = false;
        message('A autenticação foi aceite, mas não foi possível carregar o painel. Actualize a página e tente novamente.');
        script.remove();
      };
      document.body.append(script);
    }

    async function reveal(session) {
      if (!session?.user?.id) {
        shell.hidden = true;
        gate.hidden = false;
        return;
      }

      message('Conta autenticada. A consultar as permissões no banco de dados…', true);
      try {
        // Primeiro: confirmar se o utilizador pertence à administração central.
        const { data: admin, error: adminError } = await sb
          .from('platform_admins')
          .select('user_id')
          .eq('user_id', session.user.id)
          .maybeSingle();

        if (adminError) throw new Error('Falha ao consultar permissões de administrador: ' + adminError.message);

        let panelPath = './saas.js';
        let accessLabel = 'Super Administrador';

        if (!admin) {
          // Se não for administrador central, procurar uma associação activa a uma farmácia.
          const { data: memberships, error: memberError } = await sb
            .from('pharmacy_members')
            .select('pharmacy_id,role,status,pharmacies(id,name,status,currency_code,country_code)')
            .eq('user_id', session.user.id)
            .eq('status', 'active');

          if (memberError) throw new Error('Falha ao consultar a associação à farmácia: ' + memberError.message);

          const active = (memberships || []).filter(item =>
            item.pharmacies && item.pharmacies.status === 'active'
          );

          if (active.length === 0) {
            shell.hidden = true;
            gate.hidden = false;
            message('A conta existe e a palavra-passe foi aceite, mas ainda não tem acesso atribuído a uma farmácia activa. Peça ao administrador para associar esta conta.');
            return;
          }

          if (active.length > 1) {
            shell.hidden = true;
            gate.hidden = false;
            message('A conta está associada a mais de uma farmácia. É necessário seleccionar a unidade antes de abrir o sistema.');
            return;
          }

          window.KANAWA_PHARMACY_CONTEXT = active[0];
          panelPath = './app.js';
          accessLabel = String(active[0].role || 'utilizador').replaceAll('_', ' ');
        }

        const userButton = document.getElementById('userButton');
        if (userButton) {
          userButton.querySelector('b').textContent = session.user.email || 'Utilizador';
          userButton.querySelector('small').textContent = accessLabel;
        }

        gate.hidden = true;
        shell.hidden = false;
        await loadPanel(panelPath);
      } catch (error) {
        console.error('[KANAWA AUTH] Erro ao validar o acesso:', error);
        shell.hidden = true;
        gate.hidden = false;
        message(error.message || 'A conta foi autenticada, mas não foi possível consultar as permissões no banco de dados.');
      }
    }

    document.getElementById('authForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (authInProgress) return;
      authInProgress = true;
      setBusy(true);
      message('A verificar o e-mail e a palavra-passe no servidor…', true);

      try {
        if (!sb) throw new Error('O cliente Supabase não foi inicializado. Verifique a ligação do sistema.');

        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        const { data, error } = await sb.auth.signInWithPassword({ email, password });

        if (error) throw error;
        if (!data?.session?.user?.id) {
          throw new Error('O servidor não devolveu uma sessão válida. Termine e tente novamente.');
        }

        await reveal(data.session);
      } catch (error) {
        console.error('[KANAWA AUTH] Falha no login:', error);
        message(explainAuthError(error));
      } finally {
        authInProgress = false;
        setBusy(false);
      }
    });

    document.getElementById('forgotPassword').addEventListener('click', async () => {
      const email = document.getElementById('authEmail').value.trim();
      if (!email) {
        message('Introduza primeiro o seu e-mail.');
        return;
      }
      message('A enviar pedido de recuperação…', true);
      try {
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://farmacia.kanawasoft.shop/'
        });
        message(error ? explainAuthError(error) : 'Se a conta puder recuperar a palavra-passe, receberá um e-mail com as instruções.', !error);
      } catch (error) {
        message(explainAuthError(error));
      }
    });

    // Não fazer consultas à base de dados dentro do callback Auth.
    // O login e a validação de permissões são controlados pelo formulário acima.
    sb?.auth.onAuthStateChange(event => {
      if (event === 'SIGNED_OUT') {
        shell.hidden = true;
        gate.hidden = false;
        appLoaded = false;
        window.KANAWA_PHARMACY_CONTEXT = null;
      }
    });

    // Restaurar uma sessão anterior sem competir com um login iniciado pelo utilizador.
    try {
      const { data, error } = await sb.auth.getSession();
      if (error) throw error;
      if (data.session) await reveal(data.session);
    } catch (error) {
      console.error('[KANAWA AUTH] Não foi possível restaurar a sessão:', error);
      message('Não foi possível verificar a sessão guardada. Entre novamente com o seu e-mail e palavra-passe.');
    }
  </script>
</body>
</html>

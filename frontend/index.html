<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b35">
  <title>Kanawa Soft · Central SaaS</title>
  <link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="saas.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">K+</div>
        <div><strong>KANAWA SOFT</strong><small>FARMÁCIA</small></div>
      </div>
      <div class="side-caption">MENU PRINCIPAL</div>
      <nav id="navigation" aria-label="Navegação principal"></nav>
      <div class="sidebar-footer">
        <span class="status-dot"></span> Sistema
        <small>Kanawa Soft · Farmácia</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="menuToggle" aria-label="Abrir menu">☰</button>
        <div class="breadcrumb"><span>Kanawa Soft</span><b>/</b><strong id="pageTitle">Painel</strong></div>
        <div class="top-actions">
          <span class="today" id="today"></span>
          <button class="user-chip" id="userButton"><span class="avatar">KS</span><span><b>Conta</b><small>Sessão</small></span></button>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
      <footer class="app-footer">© <span id="year"></span> Kanawa Soft · Gestão integrada de farmácia</footer>
    </main>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <dialog id="recordDialog" class="record-dialog">
    <form id="recordForm" method="dialog">
      <div class="dialog-head"><div><small id="dialogEyebrow">REGISTO</small><h2 id="dialogTitle">Novo registo</h2></div><button class="icon-btn" type="button" id="closeDialog">✕</button></div>
      <div class="form-grid" id="formFields"></div>
      <div class="dialog-actions"><button type="button" class="btn btn-light" id="cancelDialog">Cancelar</button><button class="btn btn-primary" type="submit">Guardar registo</button></div>
    </form>
  </dialog>
  <style>
    .auth-gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:#f3f6f5;font-family:Arial,sans-serif}
    .auth-card{width:min(100%,420px);background:#fff;border:1px solid #e1e9e6;border-radius:18px;padding:30px;box-shadow:0 18px 60px #173d3518}
    .auth-brand{font-weight:800;letter-spacing:.08em;color:#123b35}.auth-card h1{font-size:24px;margin:22px 0 8px;color:#173d35}.auth-card p{color:#66756f;line-height:1.5}
    .auth-field{display:block;margin:16px 0}.auth-field span{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#344b43}.auth-field input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd8d3;border-radius:9px;font:inherit}
    .auth-submit{width:100%;padding:13px;border:0;border-radius:9px;background:#123b35;color:white;font-weight:700;cursor:pointer;margin-top:8px}.auth-link{border:0;background:none;color:#176b59;text-decoration:underline;cursor:pointer;padding:12px 0}.auth-message{min-height:22px;font-size:13px;color:#a33}.auth-note{font-size:12px;color:#7b8983;margin-top:18px}
  </style>
  <script type="module">
    import './supabase.js';
    const sb = window.KANAWA_SUPABASE;
    let appLoaded = false;
    const shell = document.querySelector('.app-shell');
    const footer = document.querySelector('.toast-region');
    shell.hidden = true;
    const gate = document.createElement('main');
    gate.className = 'auth-gate';
    gate.innerHTML = `
      <section class="auth-card">
        <div class="auth-brand">KANAWA SOFT · FARMÁCIA PRO</div>
        <h1 id="authTitle">Central de Administração SaaS</h1>
        <p id="authDescription">Entre com a conta de Super Administrador para gerir a plataforma.</p>
        <form id="authForm">
          <label class="auth-field"><span>E-mail</span><input id="authEmail" type="email" autocomplete="username" required placeholder="nome@empresa.com"></label>
          <label class="auth-field"><span>Palavra-passe</span><input id="authPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="A sua palavra-passe"></label>
          <button class="auth-submit" id="authSubmit" type="submit">Entrar</button>
        </form>
        <button class="auth-link" id="forgotPassword" type="button">Esqueci a palavra-passe</button>
        <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>
        <div class="auth-note">Acesso exclusivo a administradores autorizados da plataforma KANAWA SOFT.</div>
      </section>`;
    document.body.append(gate);
    const msg = (s, ok=false) => { const el=document.getElementById('authMessage');el.textContent=s;el.style.color=ok?'#176b59':'#a33'; };
    let checkingAccess = false;
    const reveal = async (session) => {
      if (!session) { shell.hidden=true; gate.hidden=false; return; }
      if (checkingAccess) return;
      checkingAccess = true;
      try {
        // Acesso ao painel SaaS apenas para utilizadores promovidos na tabela protegida.
        const { data: admin, error: accessError } = await sb
          .from('platform_admins')
          .select('user_id')
          .eq('user_id', session.user.id)
          .maybeSingle();
        if (accessError) throw accessError;
        if (!admin) {
          await sb.auth.signOut();
          shell.hidden = true;
          gate.hidden = false;
          msg('A sua conta não tem permissão de Super Administrador SaaS.');
          return;
        }
        gate.hidden=true; shell.hidden=false;
        const userButton=document.getElementById('userButton');
        if(userButton){const email=session.user.email||'Utilizador';userButton.querySelector('b').textContent=email;userButton.querySelector('small').textContent='Super Administrador';}
        if(!appLoaded){appLoaded=true;const script=document.createElement('script');script.src='./saas.js';document.body.append(script);}
      } catch (error) {
        shell.hidden=true; gate.hidden=false;
        msg('Não foi possível validar as permissões. Tente novamente.');
        console.error('[KANAWA AUTH] Falha ao validar Super Administrador:', error);
      } finally {
        checkingAccess = false;
      }
    };
    document.getElementById('authForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const button=document.getElementById('authSubmit');button.disabled=true;button.textContent='A validar…';msg('');
      try{
        const email=document.getElementById('authEmail').value.trim();
        const password=document.getElementById('authPassword').value;
        const {data,error}=await sb.auth.signInWithPassword({email,password});
        if(error)throw error;
        await reveal(data.session);
      }catch(error){msg(error.message||'Não foi possível iniciar sessão.');}
      finally{button.disabled=false;button.textContent='Entrar';}
    });
    document.getElementById('forgotPassword').addEventListener('click',async()=>{
      const email=document.getElementById('authEmail').value.trim();
      if(!email){msg('Introduza primeiro o seu e-mail.');return;}
      msg('A enviar pedido…',true);
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://farmacia.kanawasoft.shop/'});
      msg(error?error.message:'Se a conta existir, receberá um e-mail com instruções de recuperação.',!error);
    });
    sb.auth.onAuthStateChange((_event,session)=>{reveal(session);});
    const {data,error}=await sb.auth.getSession();
    if(error){msg(error.message);gate.hidden=false;}else await reveal(data.session);
  </script>
</body>
</html>
